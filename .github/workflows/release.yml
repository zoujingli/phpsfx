name: Release swoole-cli

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v0.1.0'
        required: true
        default: 'v0.1.0'
        type: string
      php_version:
        description: 'PHP version line'
        required: true
        default: '8.4'
        type: string
      swoole_cli_ref:
        description: 'swoole-cli branch, tag, or commit'
        required: true
        default: 'v6.2.0.0'
        type: string
      swoole_src_ref:
        description: 'swoole-src branch, tag, or commit'
        required: true
        default: 'v6.2.2'
        type: string
      prepare_flags:
        description: 'Optional prepare.php flags. Leave empty to use repository defaults.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            variant: linux-x64
            runner: ubuntu-latest
            profile: scripts/profiles/hyperfadmin-slim.env
            asset_suffix: ''
            asset_tail: linux-x64
            odbc: false
          - platform: linux-a64
            variant: linux-a64
            runner: ubuntu-24.04-arm
            profile: scripts/profiles/hyperfadmin-slim.env
            asset_suffix: ''
            asset_tail: linux-a64
            odbc: false
          - platform: macos-x64
            variant: macos-x64
            runner: macos-15-intel
            profile: scripts/profiles/hyperfadmin-slim.env
            asset_suffix: ''
            asset_tail: macos-x64
            odbc: false
          - platform: macos-a64
            variant: macos-a64
            runner: macos-15
            profile: scripts/profiles/hyperfadmin-slim.env
            asset_suffix: ''
            asset_tail: macos-a64
            odbc: false
          - platform: linux-x64
            variant: linux-x64-odbc
            runner: ubuntu-latest
            profile: scripts/profiles/hyperfadmin-odbc.env
            asset_suffix: odbc
            asset_tail: linux-x64-odbc
            odbc: true
          - platform: linux-a64
            variant: linux-a64-odbc
            runner: ubuntu-24.04-arm
            profile: scripts/profiles/hyperfadmin-odbc.env
            asset_suffix: odbc
            asset_tail: linux-a64-odbc
            odbc: true
          - platform: macos-x64
            variant: macos-x64-odbc
            runner: macos-15-intel
            profile: scripts/profiles/hyperfadmin-odbc.env
            asset_suffix: odbc
            asset_tail: macos-x64-odbc
            odbc: true
          - platform: macos-a64
            variant: macos-a64-odbc
            runner: macos-15
            profile: scripts/profiles/hyperfadmin-odbc.env
            asset_suffix: odbc
            asset_tail: macos-a64-odbc
            odbc: true
    env:
      PHPSFX_PLATFORM: ${{ matrix.platform }}
      PHPSFX_PROFILE_FILE: ${{ matrix.profile }}
      PHPSFX_ASSET_SUFFIX: ${{ matrix.asset_suffix }}
      PHPSFX_PHP_VERSION: ${{ github.event.inputs.php_version || '8.4' }}
      PHPSFX_SWOOLE_CLI_REF: ${{ github.event.inputs.swoole_cli_ref || 'v6.2.0.0' }}
      PHPSFX_SWOOLE_SRC_REF: ${{ github.event.inputs.swoole_src_ref || 'v6.2.2' }}
      PHPSFX_DIST_DIR: ${{ github.workspace }}/dist/${{ matrix.variant }}
      PHPSFX_BUILD_JOBS: 2

    steps:
      - name: Checkout phpsfx
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint binutils bison bzip2 ca-certificates clang clang-tools cmake coreutils curl diffutils \
            flex g++ gcc gettext git libtool libtool-bin lld locales lzip make meson musl-tools nasm netcat-openbsd \
            ninja-build p7zip-full pkg-config python3 python3-pip re2c tar unzip wget xz-utils yasm zip

      - name: Install ODBC build and smoke dependencies
        if: matrix.odbc && runner.os == 'Linux'
        run: |
          set -eux
          sudo apt-get install -y libsqliteodbc unixodbc unixodbc-dev
          odbcinst -q -d

      - name: Install macOS ODBC build and smoke dependencies
        if: matrix.odbc && runner.os == 'macOS'
        run: |
          set -eux
          brew install sqliteodbc unixodbc
          echo "PHPSFX_SWOOLE_ODBC_PREFIX=$(brew --prefix unixodbc)" >> "${GITHUB_ENV}"
          sqlite_odbc_driver="$(brew --prefix sqliteodbc)/lib/libsqlite3odbc.dylib"
          odbcinst_file="$(brew --prefix)/etc/odbcinst.ini"
          test -f "${sqlite_odbc_driver}"
          mkdir -p "$(dirname "${odbcinst_file}")"
          {
            printf '%s\n' '[SQLite3]'
            printf '%s\n' 'Description=SQLite3 ODBC Driver'
            printf 'Driver=%s\n' "${sqlite_odbc_driver}"
          } > "${odbcinst_file}"
          odbcinst -q -d -n SQLite3

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          set -eux
          brew update
          brew install autoconf automake bison cmake coreutils flex gettext libtool meson nasm ninja pkg-config re2c xz yasm || true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ github.event.inputs.php_version || '8.4' }}
          tools: composer:v2
          coverage: none
          extensions: curl, openssl, mbstring, phar, zip
          ini-values: memory_limit=-1, phar.readonly=0

      - name: Cache Swoole CLI dependency sources
        uses: actions/cache@v4
        with:
          path: .build/swoole-cli/pool
          key: phpsfx-swoole-cli-pool-${{ matrix.variant }}-${{ env.PHPSFX_SWOOLE_CLI_REF }}-${{ env.PHPSFX_SWOOLE_SRC_REF }}-${{ hashFiles('scripts/profiles/*.env') }}
          restore-keys: |
            phpsfx-swoole-cli-pool-${{ matrix.variant }}-${{ env.PHPSFX_SWOOLE_CLI_REF }}-${{ env.PHPSFX_SWOOLE_SRC_REF }}-
            phpsfx-swoole-cli-pool-${{ matrix.variant }}-${{ env.PHPSFX_SWOOLE_CLI_REF }}-
            phpsfx-swoole-cli-pool-${{ matrix.variant }}-
            phpsfx-swoole-cli-pool-${{ runner.os }}-${{ runner.arch }}-${{ env.PHPSFX_SWOOLE_CLI_REF }}-${{ env.PHPSFX_SWOOLE_SRC_REF }}-
            phpsfx-swoole-cli-pool-${{ runner.os }}-${{ runner.arch }}-${{ env.PHPSFX_SWOOLE_CLI_REF }}-
            phpsfx-swoole-cli-pool-${{ runner.os }}-${{ runner.arch }}-

      - name: Show environment
        run: |
          set -eux
          uname -a
          php -v
          composer --version
          git --version
          make --version | head -1

      - name: Install Hyperf smoke dependencies
        run: |
          composer validate --working-dir=tests/hyperf-smoke --strict
          composer install --working-dir=tests/hyperf-smoke --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Build and validate swoole-cli
        env:
          PHPSFX_SWOOLE_CLI_PREPARE_FLAGS: ${{ github.event.inputs.prepare_flags }}
        run: |
          set -euo pipefail
          if [ -z "${PHPSFX_SWOOLE_CLI_PREPARE_FLAGS:-}" ]; then
            unset PHPSFX_SWOOLE_CLI_PREPARE_FLAGS
          fi
          set +e
          bash scripts/build-swoole-cli.sh "${PHPSFX_PLATFORM}" 2>&1 | tee "build-${{ matrix.variant }}.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -ne 0 ]; then
            {
              echo "== matched errors =="
              grep -Ein 'fatal error|[^A-Za-z]error:|undefined reference|failed|killed|No such|cannot find|not found|permission denied|make(\\[[0-9]+\\])?: \\*\\*\\*' "build-${{ matrix.variant }}.log" | tail -140 || true
              echo
              echo "== build log tail =="
              tail -240 "build-${{ matrix.variant }}.log"
            } > "build-${{ matrix.variant }}-summary.log"
            if [ ! -s "build-${{ matrix.variant }}-summary.log" ]; then
              tail -120 "build-${{ matrix.variant }}.log" > "build-${{ matrix.variant }}-summary.log"
            fi
            tail_text=$(cat "build-${{ matrix.variant }}-summary.log" | tr '\n' '|' | sed -e 's/%/%25/g')
            echo "::error title=Build failed ${{ matrix.variant }}::${tail_text}"
            exit "${status}"
          fi

      - name: Test PHP and Phar SFX packaging
        run: |
          bash scripts/test-packaging.sh "dist/${{ matrix.variant }}/swoole-cli-php${PHPSFX_PHP_VERSION}-${{ matrix.asset_tail }}"

      - name: Test Hyperf 3.2 runtime
        env:
          PHPSFX_ODBC_SMOKE_DRIVER: ${{ matrix.odbc && 'SQLite3' || '' }}
        run: |
          bash scripts/test-hyperf-smoke.sh "dist/${{ matrix.variant }}/swoole-cli-php${PHPSFX_PHP_VERSION}-${{ matrix.asset_tail }}"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.variant }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build-${{ matrix.variant }}.log
            build-${{ matrix.variant }}-summary.log

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: swoole-cli-${{ matrix.variant }}
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/${{ matrix.variant }}/swoole-cli-php${{ env.PHPSFX_PHP_VERSION }}-${{ matrix.asset_tail }}
            dist/${{ matrix.variant }}/build-meta-${{ matrix.asset_tail }}.json

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    env:
      PHPSFX_RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
      PHPSFX_PHP_VERSION: ${{ github.event.inputs.php_version || '8.4' }}
      PHPSFX_SWOOLE_CLI_REF: ${{ github.event.inputs.swoole_cli_ref || 'v6.2.0.0' }}
      PHPSFX_SWOOLE_SRC_REF: ${{ github.event.inputs.swoole_src_ref || 'v6.2.2' }}
      PHPSFX_SWOOLE_CLI_PREPARE_FLAGS: ${{ github.event.inputs.prepare_flags }}
    steps:
      - name: Checkout phpsfx
        uses: actions/checkout@v4

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: swoole-cli-*
          path: dist
          merge-multiple: true

      - name: Generate release metadata
        run: |
          set -eux
          find dist -maxdepth 1 -type f -print | sort
          python3 scripts/merge-build-meta.py dist dist/build-meta.json
          cd dist
          sha256sum swoole-cli-php"${PHPSFX_PHP_VERSION}"-* > SHA256SUMS
          cat SHA256SUMS
          test -s build-meta.json
          jq -e '.platforms | length == 8' build-meta.json
          for platform in linux-x64 linux-a64 macos-x64 macos-a64; do
            default_asset="swoole-cli-php${PHPSFX_PHP_VERSION}-${platform}"
            default_meta="build-meta-${platform}.json"
            odbc_asset="${default_asset}-odbc"
            odbc_meta="build-meta-${platform}-odbc.json"
            case "${platform}" in
              linux-*) odbc_dependency=libodbc.so.2 ;;
              macos-*) odbc_dependency=libodbc.2.dylib ;;
            esac
            test -s "${default_asset}"
            test -s "${default_meta}"
            test -s "${odbc_asset}"
            test -s "${odbc_meta}"
            grep -F "  ${default_asset}" SHA256SUMS
            grep -F "  ${odbc_asset}" SHA256SUMS
            jq -e '.profile == "slim" and .swoole_odbc == false and .odbc_dynamic_dependency == ""' \
              "${default_meta}"
            jq -e --arg dependency "${odbc_dependency}" \
              '.profile == "hyperfadmin-odbc" and .swoole_odbc == true and .odbc_dynamic_dependency == $dependency' \
              "${odbc_meta}"
            jq -e --arg asset "${odbc_asset}" \
              '.platforms | any(.asset == $asset and .swoole_odbc == true)' build-meta.json
          done

      - name: Upload combined workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: swoole-cli-release-${{ env.PHPSFX_RELEASE_VERSION }}
          retention-days: 90
          if-no-files-found: error
          path: |
            dist/swoole-cli-php${{ env.PHPSFX_PHP_VERSION }}-*
            dist/build-meta-*.json
            dist/SHA256SUMS
            dist/build-meta.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PHPSFX_RELEASE_VERSION }}
          name: phpsfx ${{ env.PHPSFX_RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          body: |
            Swoole CLI PHP ${{ env.PHPSFX_PHP_VERSION }} slim runtime with Swoole ${{ env.PHPSFX_SWOOLE_SRC_REF }}.

            This release uses the slim profile and Swoole CLI SFX format:

            `swoole-cli + payload.php|app.phar + pack('J', payloadSize)`

            Run packed applications with `--self`, for example `./app --self list`.

            The four default assets include native MySQL and SQLite support without an ODBC runtime
            dependency. The optional `*-odbc` assets add PDO ODBC and Swoole coroutine ODBC support;
            they require the system unixODBC runtime plus a separately installed vendor driver matching
            the target platform and architecture. Vendor drivers and credentials are not bundled.
          files: |
            dist/swoole-cli-php${{ env.PHPSFX_PHP_VERSION }}-*
            dist/build-meta-*.json
            dist/SHA256SUMS
            dist/build-meta.json
