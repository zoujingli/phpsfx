name: Release swoole-cli

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Self-maintained swoole-cli release or workflow artifact version'
        required: true
        default: 'v6.2.3.2'
        type: string
      publish:
        description: 'Create a GitHub Release after all builds and checks pass'
        required: true
        default: false
        type: boolean
      php_version:
        description: 'PHP version line'
        required: true
        default: '8.5'
        type: string
      php_full_version:
        description: 'Exact PHP source/runtime version'
        required: true
        default: '8.5.9'
        type: string
      swoole_cli_ref:
        description: 'Pinned official swoole-cli baseline commit'
        required: true
        default: 'f7903840c3e959612dac7d413205e1bdb0067029'
        type: string
      swoole_src_ref:
        description: 'swoole-src branch, tag, or commit'
        required: true
        default: 'v6.2.3'
        type: string
      prepare_flags:
        description: 'Optional prepare.php flags. Leave empty to use repository defaults.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build ${{ format('{0}-{1}{2}', matrix.platform.name, matrix.database, matrix.odbc && '-odbc' || '') }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x64, runner: ubuntu-latest }
          - { name: linux-a64, runner: ubuntu-24.04-arm }
          - { name: macos-x64, runner: macos-15-intel }
          - { name: macos-a64, runner: macos-15 }
        database: [sqlite, mysql, pgsql, mysql-pgsql, pgsql-sqlite, mysql-sqlite, mysql-pgsql-sqlite]
        odbc: [false, true]
    env:
      PHPSFX_VARIANT: ${{ format('{0}-{1}{2}', matrix.platform.name, matrix.database, matrix.odbc && '-odbc' || '') }}
      PHPSFX_PLATFORM: ${{ matrix.platform.name }}
      PHPSFX_DB_VARIANT: ${{ matrix.database }}
      PHPSFX_PROFILE_FILE: ${{ matrix.odbc && 'scripts/profiles/hyperfadmin-odbc.env' || 'scripts/profiles/hyperfadmin-slim.env' }}
      PHPSFX_RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
      PHPSFX_PHP_VERSION: ${{ github.event.inputs.php_version || '8.5' }}
      PHPSFX_PHP_FULL_VERSION: ${{ github.event.inputs.php_full_version || '8.5.9' }}
      PHPSFX_SWOOLE_CLI_REF: ${{ github.event.inputs.swoole_cli_ref || 'f7903840c3e959612dac7d413205e1bdb0067029' }}
      PHPSFX_SWOOLE_SRC_REF: ${{ github.event.inputs.swoole_src_ref || 'v6.2.3' }}
      PHPSFX_DIST_DIR: ${{ github.workspace }}/dist/${{ format('{0}-{1}{2}', matrix.platform.name, matrix.database, matrix.odbc && '-odbc' || '') }}
      PHPSFX_BUILD_JOBS: 2

    steps:
      - name: Checkout self-maintained swoole-cli
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint binutils bison bzip2 ca-certificates clang clang-tools cmake coreutils curl diffutils \
            flex g++ gcc gettext git libtool libtool-bin lld locales lzip make meson musl-tools nasm netcat-openbsd \
            ninja-build p7zip-full pkg-config python3 python3-pip re2c tar unzip wget xz-utils yasm zip

      - name: Install ODBC build and smoke dependencies
        if: matrix.odbc && runner.os == 'Linux'
        run: |
          set -eux
          sudo apt-get install -y libsqliteodbc unixodbc unixodbc-dev
          odbcinst -q -d

      - name: Install macOS ODBC build and smoke dependencies
        if: matrix.odbc && runner.os == 'macOS'
        run: |
          set -eux
          brew install sqliteodbc unixodbc
          echo "PHPSFX_SWOOLE_ODBC_PREFIX=$(brew --prefix unixodbc)" >> "${GITHUB_ENV}"
          sqlite_odbc_driver="$(brew --prefix sqliteodbc)/lib/libsqlite3odbc.dylib"
          odbcinst_file="$(brew --prefix)/etc/odbcinst.ini"
          test -f "${sqlite_odbc_driver}"
          mkdir -p "$(dirname "${odbcinst_file}")"
          {
            printf '%s\n' '[SQLite3]'
            printf '%s\n' 'Description=SQLite3 ODBC Driver'
            printf 'Driver=%s\n' "${sqlite_odbc_driver}"
          } > "${odbcinst_file}"
          odbcinst -q -d -n SQLite3

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          set -eux
          # Hosted macOS images already ship Homebrew and the required formula
          # metadata. Avoid an unbounded repository update on Intel runners.
          HOMEBREW_NO_AUTO_UPDATE=1 brew install autoconf automake bison cmake coreutils flex gettext libtool meson nasm ninja pkg-config re2c xz yasm || true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ github.event.inputs.php_version || '8.5' }}
          tools: composer:v2
          coverage: none
          extensions: curl, openssl, mbstring, phar, zip
          ini-values: memory_limit=-1, phar.readonly=0

      - name: Cache Swoole CLI dependency sources
        uses: actions/cache@v4
        with:
          path: .build/swoole-cli/pool
          key: phpsfx-swoole-cli-pool-${{ env.PHPSFX_VARIANT }}-${{ env.PHPSFX_SWOOLE_CLI_REF }}-${{ env.PHPSFX_SWOOLE_SRC_REF }}-${{ hashFiles('scripts/profiles/*.env') }}
          restore-keys: |
            phpsfx-swoole-cli-pool-${{ env.PHPSFX_VARIANT }}-${{ env.PHPSFX_SWOOLE_CLI_REF }}-${{ env.PHPSFX_SWOOLE_SRC_REF }}-
            phpsfx-swoole-cli-pool-${{ env.PHPSFX_VARIANT }}-${{ env.PHPSFX_SWOOLE_CLI_REF }}-
            phpsfx-swoole-cli-pool-${{ env.PHPSFX_VARIANT }}-
            phpsfx-swoole-cli-pool-${{ runner.os }}-${{ runner.arch }}-${{ env.PHPSFX_SWOOLE_CLI_REF }}-${{ env.PHPSFX_SWOOLE_SRC_REF }}-
            phpsfx-swoole-cli-pool-${{ runner.os }}-${{ runner.arch }}-${{ env.PHPSFX_SWOOLE_CLI_REF }}-
            phpsfx-swoole-cli-pool-${{ runner.os }}-${{ runner.arch }}-

      - name: Show environment
        run: |
          set -eux
          uname -a
          php -v
          composer --version
          git --version
          make --version | head -1

      - name: Check release profiles and asset names
        run: bash tests/test-release-variants.sh

      - name: Install Hyperf smoke dependencies
        run: |
          composer validate --working-dir=tests/hyperf-smoke --strict
          composer install --working-dir=tests/hyperf-smoke --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Build and validate swoole-cli
        env:
          PHPSFX_SWOOLE_CLI_PREPARE_FLAGS: ${{ github.event.inputs.prepare_flags }}
        run: |
          set -euo pipefail
          if [ -z "${PHPSFX_SWOOLE_CLI_PREPARE_FLAGS:-}" ]; then
            unset PHPSFX_SWOOLE_CLI_PREPARE_FLAGS
          fi
          set +e
          bash scripts/build-swoole-cli.sh "${PHPSFX_PLATFORM}" 2>&1 | tee "build-${PHPSFX_VARIANT}.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -ne 0 ]; then
            {
              echo "== matched errors =="
              grep -Ein 'fatal error|[^A-Za-z]error:|undefined reference|failed|killed|No such|cannot find|not found|permission denied|make(\\[[0-9]+\\])?: \\*\\*\\*' "build-${PHPSFX_VARIANT}.log" | tail -140 || true
              echo
              echo "== build log tail =="
              tail -240 "build-${PHPSFX_VARIANT}.log"
            } > "build-${PHPSFX_VARIANT}-summary.log"
            if [ ! -s "build-${PHPSFX_VARIANT}-summary.log" ]; then
              tail -120 "build-${PHPSFX_VARIANT}.log" > "build-${PHPSFX_VARIANT}-summary.log"
            fi
            tail_text=$(cat "build-${PHPSFX_VARIANT}-summary.log" | tr '\n' '|' | sed -e 's/%/%25/g')
            echo "::error title=Build failed ${PHPSFX_VARIANT}::${tail_text}"
            exit "${status}"
          fi

      - name: Test PHP and Phar SFX packaging
        run: |
          bash scripts/test-packaging.sh "dist/${PHPSFX_VARIANT}/swoole-cli-php${PHPSFX_PHP_VERSION}-${PHPSFX_VARIANT}"

      - name: Test Hyperf 3.2 runtime
        env:
          PHPSFX_ODBC_SMOKE_DRIVER: ${{ matrix.odbc && 'SQLite3' || '' }}
        run: |
          bash scripts/test-hyperf-smoke.sh "dist/${PHPSFX_VARIANT}/swoole-cli-php${PHPSFX_PHP_VERSION}-${PHPSFX_VARIANT}"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.PHPSFX_VARIANT }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build-${{ env.PHPSFX_VARIANT }}.log
            build-${{ env.PHPSFX_VARIANT }}-summary.log

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: swoole-cli-${{ env.PHPSFX_VARIANT }}
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/${{ env.PHPSFX_VARIANT }}/swoole-cli-php${{ env.PHPSFX_PHP_VERSION }}-${{ env.PHPSFX_VARIANT }}
            dist/${{ env.PHPSFX_VARIANT }}/build-meta-${{ env.PHPSFX_VARIANT }}.json

  release:
    name: Package and optionally publish
    runs-on: ubuntu-latest
    needs: build
    env:
      PHPSFX_RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
      PHPSFX_PHP_VERSION: ${{ github.event.inputs.php_version || '8.5' }}
      PHPSFX_PHP_FULL_VERSION: ${{ github.event.inputs.php_full_version || '8.5.9' }}
      PHPSFX_SWOOLE_CLI_REF: ${{ github.event.inputs.swoole_cli_ref || 'f7903840c3e959612dac7d413205e1bdb0067029' }}
      PHPSFX_SWOOLE_SRC_REF: ${{ github.event.inputs.swoole_src_ref || 'v6.2.3' }}
      PHPSFX_SWOOLE_CLI_PREPARE_FLAGS: ${{ github.event.inputs.prepare_flags }}
    steps:
      - name: Checkout self-maintained swoole-cli
        uses: actions/checkout@v4

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: swoole-cli-*
          path: dist
          merge-multiple: true

      - name: Generate release metadata
        run: |
          set -eux
          find dist -maxdepth 1 -type f -print | sort
          python3 scripts/merge-build-meta.py dist dist/build-meta.json
          cd dist
          sha256sum swoole-cli-php"${PHPSFX_PHP_VERSION}"-* > SHA256SUMS
          cat SHA256SUMS
          test -s build-meta.json
          test "$(find . -maxdepth 1 -type f -name 'swoole-cli-php*' | wc -l | tr -d ' ')" -eq 56
          test "$(find . -maxdepth 1 -type f -name 'build-meta-*.json' | wc -l | tr -d ' ')" -eq 56
          test "$(wc -l < SHA256SUMS | tr -d ' ')" -eq 56
          sha256sum -c SHA256SUMS
          jq -e --arg version "${PHPSFX_RELEASE_VERSION}" '
            .version == $version and (.platforms | length == 56) and
            (.platforms | map(.variant) | unique | length == 56) and
            (.platforms | map(.asset) | unique | length == 56) and
            (.database_variants | sort == ["mysql", "mysql-pgsql", "mysql-pgsql-sqlite", "mysql-sqlite", "pgsql", "pgsql-sqlite", "sqlite"]) and
            (.cli_versions == [$version])
          ' build-meta.json
          for platform in linux-x64 linux-a64 macos-x64 macos-a64; do
            case "${platform}" in
              linux-*) odbc_dependency=libodbc.so.2 ;;
              macos-*) odbc_dependency=libodbc.2.dylib ;;
            esac
            for database in sqlite mysql pgsql mysql-pgsql pgsql-sqlite mysql-sqlite mysql-pgsql-sqlite; do
              case "${database}" in
                sqlite) drivers=sqlite; forbidden=pdo_mysql,pdo_pgsql ;;
                mysql) drivers=mysql; forbidden=pdo_pgsql,pdo_sqlite ;;
                pgsql) drivers=pgsql; forbidden=pdo_mysql,pdo_sqlite ;;
                mysql-pgsql) drivers=mysql,pgsql; forbidden=pdo_sqlite ;;
                pgsql-sqlite) drivers=pgsql,sqlite; forbidden=pdo_mysql ;;
                mysql-sqlite) drivers=mysql,sqlite; forbidden=pdo_pgsql ;;
                mysql-pgsql-sqlite) drivers=mysql,pgsql,sqlite; forbidden= ;;
              esac
              for odbc in false true; do
                suffix=
                profile=hyperfadmin-slim
                dependency=
                expected_drivers="${drivers}"
                if [ "${odbc}" = true ]; then
                  suffix=-odbc
                  profile=hyperfadmin-odbc
                  dependency="${odbc_dependency}"
                  expected_drivers="${drivers},odbc"
                fi
                variant="${platform}-${database}${suffix}"
                asset="swoole-cli-php${PHPSFX_PHP_VERSION}-${variant}"
                meta="build-meta-${variant}.json"
                test -s "${asset}"
                test -s "${meta}"
                grep -Fx "$(sha256sum "${asset}")" SHA256SUMS
                jq -e --arg platform "${platform}" --arg variant "${variant}" \
                  --arg asset "${asset}" --arg database "${database}" \
                  --arg profile "${profile}" --arg drivers "${expected_drivers}" \
                  --arg forbidden "${forbidden}" \
                  --arg dependency "${dependency}" --arg version "${PHPSFX_RELEASE_VERSION}" \
                  --arg sha "$(sha256sum "${asset}" | cut -d ' ' -f 1)" \
                  '.platform == $platform and .variant == $variant and .asset == $asset and
                   .database_variant == $database and .profile == $profile and
                   .required_pdo_drivers == $drivers and .odbc_dynamic_dependency == $dependency and
                   .swoole_odbc == ($dependency != "") and .cli_version == $version and .sha256 == $sha and
                   ((.forbidden_extensions | split(",")) as $excluded |
                    ($excluded | index("mysqli") != null and index("pgsql") != null and index("sqlite3") != null) and
                    (if $forbidden == "" then true else (($forbidden | split(",")) - $excluded | length == 0) end))' \
                  "${meta}"
                jq -e --arg variant "${variant}" --slurpfile metadata "${meta}" \
                  '.platforms | any(.variant == $variant and . == $metadata[0])' build-meta.json
              done
            done
          done

      - name: Upload combined workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: swoole-cli-release-${{ env.PHPSFX_RELEASE_VERSION }}
          retention-days: 90
          if-no-files-found: error
          path: |
            dist/swoole-cli-php${{ env.PHPSFX_PHP_VERSION }}-*
            dist/build-meta-*.json
            dist/SHA256SUMS
            dist/build-meta.json

      - name: Create GitHub Release
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PHPSFX_RELEASE_VERSION }}
          name: swoole-cli ${{ env.PHPSFX_RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          body: |
            Self-maintained swoole-cli ${{ env.PHPSFX_RELEASE_VERSION }} with PHP ${{ env.PHPSFX_PHP_FULL_VERSION }} and Swoole ${{ env.PHPSFX_SWOOLE_SRC_REF }}.

            This release uses the slim profile and Swoole CLI SFX format:

            `swoole-cli + payload.php|app.phar + pack('J', payloadSize)`

            Run packed applications with `--self`, for example `./app --self list`.

            The four platforms each provide seven PDO-only combinations: `sqlite`, `mysql`,
            `pgsql`, `mysql-pgsql`, `pgsql-sqlite`, `mysql-sqlite`, and `mysql-pgsql-sqlite`.
            Each combination also has a `-odbc` variant, for 56 binaries and 114 Release assets.
            ODBC variants add PDO ODBC and Swoole coroutine ODBC;
            they require the system unixODBC runtime plus a separately installed vendor driver
            matching the platform and architecture. Vendor drivers and credentials are not bundled.
          files: |
            dist/swoole-cli-php${{ env.PHPSFX_PHP_VERSION }}-*
            dist/build-meta-*.json
            dist/SHA256SUMS
            dist/build-meta.json

      - name: Verify published Release assets
        if: github.event_name == 'push' || inputs.publish
        run: python3 scripts/verify-release-assets.py "${{ github.repository }}" "${PHPSFX_RELEASE_VERSION}" dist
