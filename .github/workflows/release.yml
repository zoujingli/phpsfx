name: Release swoole-cli

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Self-maintained swoole-cli release or workflow artifact version'
        required: true
        default: 'v6.2.5.0'
        type: string
      publish:
        description: 'Create a GitHub Release after all builds and checks pass'
        required: true
        default: false
        type: boolean
      php_version:
        description: 'PHP version lines to build (both by default)'
        required: true
        default: 'both'
        type: choice
        options: [both, '8.4', '8.5']
      php_full_version:
        description: 'Optional exact PHP version override for a single version line'
        required: false
        default: ''
        type: string
      php84_full_version:
        description: 'Exact PHP 8.4 source/runtime version'
        required: true
        default: '8.4.27'
        type: string
      php85_full_version:
        description: 'Exact PHP 8.5 source/runtime version'
        required: true
        default: '8.5.12'
        type: string
      swoole_cli_ref:
        description: 'Pinned official swoole-cli baseline commit'
        required: true
        default: 'e891b2b38720c5879c9a2c7894384b9af7228de0'
        type: string
      swoole_src_ref:
        description: 'swoole-src branch, tag, or commit'
        required: true
        default: 'v6.2.5'
        type: string
      prepare_flags:
        description: 'Optional prepare.php flags. Leave empty to use repository defaults.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build PHP ${{ matrix.php }} ${{ matrix.platform.name }}-${{ matrix.package.name }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(github.event.inputs.php_version == '8.4' && '["8.4"]' || github.event.inputs.php_version == '8.5' && '["8.5"]' || '["8.4","8.5"]') }}
        platform:
          - { name: linux-x64, runner: ubuntu-latest }
          - { name: linux-a64, runner: ubuntu-24.04-arm }
          - { name: macos-a64, runner: macos-15 }
        package:
          - { name: mysql, database: mysql, odbc: false }
          - { name: pgsql, database: pgsql, odbc: false }
          - { name: odbc, database: odbc, odbc: true }
          - { name: sqlite-mysql-pgsql, database: sqlite-mysql-pgsql, odbc: true }
    env:
      PHPSFX_VARIANT: ${{ format('{0}-{1}', matrix.platform.name, matrix.package.name) }}
      PHPSFX_BUILD_KEY: ${{ format('php{0}-{1}-{2}', matrix.php, matrix.platform.name, matrix.package.name) }}
      PHPSFX_PLATFORM: ${{ matrix.platform.name }}
      PHPSFX_DB_VARIANT: ${{ matrix.package.database }}
      PHPSFX_SWOOLE_ODBC: ${{ matrix.package.odbc && (matrix.package.name == 'odbc' || startsWith(matrix.platform.name, 'linux-')) && '1' || '0' }}
      PHPSFX_PROFILE_FILE: ${{ matrix.package.odbc && (matrix.package.name == 'odbc' || startsWith(matrix.platform.name, 'linux-')) && 'scripts/profiles/hyperfadmin-odbc.env' || 'scripts/profiles/hyperfadmin-slim.env' }}
      PHPSFX_RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
      PHPSFX_PHP_VERSION: ${{ matrix.php }}
      PHPSFX_PHP_FULL_VERSION: ${{ github.event.inputs.php_full_version || (matrix.php == '8.4' && (github.event.inputs.php84_full_version || '8.4.27')) || github.event.inputs.php85_full_version || '8.5.12' }}
      PHPSFX_SWOOLE_CLI_REF: ${{ github.event.inputs.swoole_cli_ref || 'e891b2b38720c5879c9a2c7894384b9af7228de0' }}
      PHPSFX_SWOOLE_SRC_REF: ${{ github.event.inputs.swoole_src_ref || 'v6.2.5' }}
      PHPSFX_DIST_DIR: ${{ github.workspace }}/dist/${{ format('php{0}-{1}-{2}', matrix.php, matrix.platform.name, matrix.package.name) }}
      PHPSFX_BUILD_JOBS: 2

    steps:
      - name: Checkout self-maintained swoole-cli
        uses: actions/checkout@v4

      - name: Validate PHP version selection
        env:
          PHP_SELECTION: ${{ github.event.inputs.php_version || 'both' }}
          PHP_FULL_OVERRIDE: ${{ github.event.inputs.php_full_version }}
        run: |
          if [ "${PHP_SELECTION}" = both ] && [ -n "${PHP_FULL_OVERRIDE}" ]; then
            echo 'Use php84_full_version and php85_full_version when building both PHP lines' >&2
            exit 2
          fi

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint binutils bison bzip2 ca-certificates clang clang-tools cmake coreutils curl diffutils \
            flex g++ gcc gettext git libtool libtool-bin lld locales lzip make meson musl-tools nasm netcat-openbsd \
            ninja-build p7zip-full pkg-config python3 python3-pip re2c tar unzip wget xz-utils yasm zip

      - name: Install ODBC build and smoke dependencies
        if: env.PHPSFX_SWOOLE_ODBC == '1' && runner.os == 'Linux'
        run: |
          set -eux
          sudo apt-get install -y libsqliteodbc unixodbc unixodbc-dev
          odbcinst -q -d

      - name: Install macOS ODBC build and smoke dependencies
        if: env.PHPSFX_SWOOLE_ODBC == '1' && runner.os == 'macOS'
        run: |
          set -eux
          brew install sqliteodbc unixodbc
          echo "PHPSFX_SWOOLE_ODBC_PREFIX=$(brew --prefix unixodbc)" >> "${GITHUB_ENV}"
          sqlite_odbc_driver="$(brew --prefix sqliteodbc)/lib/libsqlite3odbc.dylib"
          odbcinst_file="$(brew --prefix)/etc/odbcinst.ini"
          test -f "${sqlite_odbc_driver}"
          mkdir -p "$(dirname "${odbcinst_file}")"
          {
            printf '%s\n' '[SQLite3]'
            printf '%s\n' 'Description=SQLite3 ODBC Driver'
            printf 'Driver=%s\n' "${sqlite_odbc_driver}"
          } > "${odbcinst_file}"
          odbcinst -q -d -n SQLite3

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          set -eux
          # Hosted macOS images already ship Homebrew and the required formula
          # metadata. Avoid an unbounded repository update on Intel runners.
          HOMEBREW_NO_AUTO_UPDATE=1 brew install autoconf automake bison cmake coreutils flex gettext libtool meson nasm ninja pkg-config re2c xz yasm || true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
          extensions: curl, openssl, mbstring, phar, zip
          ini-values: memory_limit=-1, phar.readonly=0

      - name: Cache Swoole CLI dependency sources
        uses: actions/cache@v4
        with:
          path: .build/swoole-cli/pool
          key: phpsfx-swoole-cli-pool-${{ env.PHPSFX_BUILD_KEY }}-${{ env.PHPSFX_PHP_FULL_VERSION }}-${{ env.PHPSFX_SWOOLE_CLI_REF }}-${{ env.PHPSFX_SWOOLE_SRC_REF }}-${{ hashFiles('scripts/profiles/*.env') }}
          restore-keys: |
            phpsfx-swoole-cli-pool-${{ env.PHPSFX_BUILD_KEY }}-${{ env.PHPSFX_PHP_FULL_VERSION }}-${{ env.PHPSFX_SWOOLE_CLI_REF }}-${{ env.PHPSFX_SWOOLE_SRC_REF }}-
            phpsfx-swoole-cli-pool-${{ env.PHPSFX_BUILD_KEY }}-
            phpsfx-swoole-cli-pool-${{ env.PHPSFX_VARIANT }}-${{ env.PHPSFX_SWOOLE_CLI_REF }}-${{ env.PHPSFX_SWOOLE_SRC_REF }}-
            phpsfx-swoole-cli-pool-${{ env.PHPSFX_VARIANT }}-${{ env.PHPSFX_SWOOLE_CLI_REF }}-
            phpsfx-swoole-cli-pool-${{ env.PHPSFX_VARIANT }}-
            phpsfx-swoole-cli-pool-${{ runner.os }}-${{ runner.arch }}-${{ env.PHPSFX_SWOOLE_CLI_REF }}-${{ env.PHPSFX_SWOOLE_SRC_REF }}-
            phpsfx-swoole-cli-pool-${{ runner.os }}-${{ runner.arch }}-${{ env.PHPSFX_SWOOLE_CLI_REF }}-
            phpsfx-swoole-cli-pool-${{ runner.os }}-${{ runner.arch }}-

      - name: Show environment
        run: |
          set -eux
          uname -a
          php -v
          composer --version
          git --version
          make --version | head -1

      - name: Check release profiles and asset names
        run: bash tests/test-release-variants.sh

      - name: Install Hyperf smoke dependencies
        run: |
          composer validate --working-dir=tests/hyperf-smoke --strict
          composer install --working-dir=tests/hyperf-smoke --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Build and validate swoole-cli
        env:
          PHPSFX_SWOOLE_CLI_PREPARE_FLAGS: ${{ github.event.inputs.prepare_flags }}
        run: |
          set -euo pipefail
          if [ -z "${PHPSFX_SWOOLE_CLI_PREPARE_FLAGS:-}" ]; then
            unset PHPSFX_SWOOLE_CLI_PREPARE_FLAGS
          fi
          set +e
          bash scripts/build-swoole-cli.sh "${PHPSFX_PLATFORM}" 2>&1 | tee "build-${PHPSFX_BUILD_KEY}.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -ne 0 ]; then
            {
              echo "== matched errors =="
              grep -Ein 'fatal error|[^A-Za-z]error:|undefined reference|failed|killed|No such|cannot find|not found|permission denied|make(\\[[0-9]+\\])?: \\*\\*\\*' "build-${PHPSFX_BUILD_KEY}.log" | tail -140 || true
              echo
              echo "== build log tail =="
              tail -240 "build-${PHPSFX_BUILD_KEY}.log"
            } > "build-${PHPSFX_BUILD_KEY}-summary.log"
            if [ ! -s "build-${PHPSFX_BUILD_KEY}-summary.log" ]; then
              tail -120 "build-${PHPSFX_BUILD_KEY}.log" > "build-${PHPSFX_BUILD_KEY}-summary.log"
            fi
            tail_text=$(cat "build-${PHPSFX_BUILD_KEY}-summary.log" | tr '\n' '|' | sed -e 's/%/%25/g')
            echo "::error title=Build failed ${PHPSFX_BUILD_KEY}::${tail_text}"
            exit "${status}"
          fi

      - name: Test PHP and Phar SFX packaging
        run: |
          bash scripts/test-packaging.sh "${PHPSFX_DIST_DIR}/swoole-cli-php${PHPSFX_PHP_VERSION}-${PHPSFX_VARIANT}"

      - name: Test Hyperf 3.2 runtime
        env:
          PHPSFX_ODBC_SMOKE_DRIVER: ${{ env.PHPSFX_SWOOLE_ODBC == '1' && 'SQLite3' || '' }}
        run: |
          bash scripts/test-hyperf-smoke.sh "${PHPSFX_DIST_DIR}/swoole-cli-php${PHPSFX_PHP_VERSION}-${PHPSFX_VARIANT}"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.PHPSFX_BUILD_KEY }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build-${{ env.PHPSFX_BUILD_KEY }}.log
            build-${{ env.PHPSFX_BUILD_KEY }}-summary.log

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: swoole-cli-${{ env.PHPSFX_BUILD_KEY }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ env.PHPSFX_DIST_DIR }}/swoole-cli-php${{ env.PHPSFX_PHP_VERSION }}-${{ env.PHPSFX_VARIANT }}
            ${{ env.PHPSFX_DIST_DIR }}/build-meta-${{ env.PHPSFX_BUILD_KEY }}.json

  release:
    name: Package and optionally publish
    runs-on: ubuntu-latest
    needs: build
    env:
      PHPSFX_RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
      PHPSFX_PHP_VERSIONS: ${{ github.event.inputs.php_version == '8.4' && '8.4' || github.event.inputs.php_version == '8.5' && '8.5' || '8.4 8.5' }}
      PHPSFX_PHP84_FULL_VERSION: ${{ (github.event.inputs.php_version == '8.4' && github.event.inputs.php_full_version) || github.event.inputs.php84_full_version || '8.4.27' }}
      PHPSFX_PHP85_FULL_VERSION: ${{ (github.event.inputs.php_version == '8.5' && github.event.inputs.php_full_version) || github.event.inputs.php85_full_version || '8.5.12' }}
      PHPSFX_SWOOLE_CLI_REF: ${{ github.event.inputs.swoole_cli_ref || 'e891b2b38720c5879c9a2c7894384b9af7228de0' }}
      PHPSFX_SWOOLE_SRC_REF: ${{ github.event.inputs.swoole_src_ref || 'v6.2.5' }}
      PHPSFX_SWOOLE_CLI_PREPARE_FLAGS: ${{ github.event.inputs.prepare_flags }}
    steps:
      - name: Checkout self-maintained swoole-cli
        uses: actions/checkout@v4

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: swoole-cli-*
          path: dist
          merge-multiple: true

      - name: Generate release metadata
        id: release_meta
        run: |
          set -eux
          find dist -maxdepth 1 -type f -print | sort
          python3 tests/test-verify-release-assets.py
          python3 scripts/merge-build-meta.py dist dist/build-meta.json
          cd dist
          sha256sum swoole-cli-php* > SHA256SUMS
          python3 ../scripts/verify-release-assets.py --local "${PHPSFX_RELEASE_VERSION}" .
          binary_count=$(jq '.platforms | length' build-meta.json)
          {
            printf 'binaries=%s\n' "${binary_count}"
            printf 'assets=%s\n' "$((binary_count + 2))"
            printf 'php_releases=%s\n' "$(jq -r '.php_full_versions | join(" / ")' build-meta.json)"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload combined workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: swoole-cli-release-${{ env.PHPSFX_RELEASE_VERSION }}
          retention-days: 90
          if-no-files-found: error
          path: |
            dist/swoole-cli-php*
            dist/build-meta-*.json
            dist/SHA256SUMS
            dist/build-meta.json

      - name: Create GitHub Release
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PHPSFX_RELEASE_VERSION }}
          name: swoole-cli ${{ env.PHPSFX_RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          body: |
            Self-maintained swoole-cli ${{ env.PHPSFX_RELEASE_VERSION }} with PHP ${{ steps.release_meta.outputs.php_releases }} and Swoole ${{ env.PHPSFX_SWOOLE_SRC_REF }}.

            This release uses the slim profile and Swoole CLI SFX format:

            `swoole-cli + payload.php|app.phar + pack('J', payloadSize)`

            Run packed applications with `--self`, for example `./app --self list`.

            Linux x86_64, Linux ARM64 and macOS ARM64 each provide four PDO-only packages:
            `mysql`, `pgsql` and `odbc` for production, and `sqlite-mysql-pgsql` for development.
            Each selected PHP version line provides all four packages on each platform,
            for ${{ steps.release_meta.outputs.binaries }} binaries and ${{ steps.release_meta.outputs.assets }} Release assets.
            Binary filenames include `php8.4` or `php8.5` to keep both version lines separate.
            All per-build metadata is included in `build-meta.json`; `SHA256SUMS` covers every binary.
            The `odbc` production package on all platforms and the Linux development package
            provide PDO ODBC and Swoole coroutine ODBC; the macOS development package excludes ODBC.
            Packages with ODBC support require the system unixODBC runtime plus a separately installed vendor driver
            matching the platform and architecture. Vendor drivers and credentials are not bundled.
          files: |
            dist/swoole-cli-php*
            dist/SHA256SUMS
            dist/build-meta.json

      - name: Verify published Release assets
        if: github.event_name == 'push' || inputs.publish
        run: python3 scripts/verify-release-assets.py "${{ github.repository }}" "${PHPSFX_RELEASE_VERSION}" dist
